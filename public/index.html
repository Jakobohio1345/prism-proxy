<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prism</title>
  <meta name="theme-color" content="#4f6bff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f6bff'/%3E%3Cpath d='M16 6l9 16H7z' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/_/app.css">
</head>
<body>
  <div id="app">
    <header id="chrome">
      <div id="tabstrip" role="tablist" aria-label="Tabs"></div>

      <div id="toolbar">
        <button class="icon" id="btn-back" title="Back" aria-label="Back" disabled>
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="icon" id="btn-forward" title="Forward" aria-label="Forward" disabled>
          <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="icon" id="btn-reload" title="Reload" aria-label="Reload">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/></svg>
        </button>
        <button class="icon" id="btn-home" title="Home" aria-label="Home">
          <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></svg>
        </button>

        <form id="omnibox" autocomplete="off">
          <span id="secure" class="secure" title="Connection"></span>
          <input id="url" type="text" spellcheck="false" autocapitalize="off" autocorrect="off"
                 placeholder="Search or enter address" aria-label="Address bar">
          <button class="icon small" id="btn-star" type="button" title="Bookmark this page" aria-label="Bookmark this page">
            <svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
          </button>
        </form>

        <div class="menu-wrap">
          <button class="icon" id="btn-menu" title="Settings" aria-label="Settings" aria-haspopup="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>
          </button>
          <div id="menu" hidden>
            <label>Search engine
              <select id="set-engine"></select>
            </label>
            <label>Theme
              <select id="set-theme">
                <option value="auto">Match system</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
              </select>
            </label>
            <label class="check"><input type="checkbox" id="set-block"> Block ads &amp; trackers</label>
            <hr>
            <button id="btn-clear" class="danger">Clear bookmarks &amp; site data</button>
            <p class="hint">Prism proxies pages through this server. Don’t sign in to sensitive accounts (banking, email) on a proxy you don’t fully trust.</p>
          </div>
        </div>
      </div>

      <nav id="bookmarks" aria-label="Bookmarks"></nav>
      <div id="progress" hidden></div>
    </header>

    <main id="viewport">
      <section id="start">
        <div class="start-inner">
          <div class="logo">
            <svg viewBox="0 0 32 32" width="56" height="56"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M16 6l9 16H7z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>
            <h1>Prism</h1>
          </div>
          <form id="start-form" autocomplete="off">
            <input id="start-input" type="text" spellcheck="false" placeholder="Search the web or type a URL" aria-label="Search or enter address" autofocus>
          </form>
          <div id="tiles"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="/_/app.js"></script>
</body>
</html>
